# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - chickenai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: chickenai-bfd5ffaccagwhrhy.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8F97F572F7D0433386560EFEA11BEB8D }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_C9B9B3149AEA423EBD81A02A5A760AA4 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: chickenai-bfd5ffaccagwhrhy.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8F97F572F7D0433386560EFEA11BEB8D }}/chicken:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45C6F80F5FBA4BA0853206A8887CFBEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6580E5F2454D4F8E8A7C1E5B714A4EAD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C30266C13F3A4B97A332B4467D5BA4D8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'chickenai'
          slot-name: 'Production'
          images: 'chickenai-bfd5ffaccagwhrhy.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8F97F572F7D0433386560EFEA11BEB8D }}/chicken:${{ github.sha }}'
          